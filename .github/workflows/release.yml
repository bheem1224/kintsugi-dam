name: Build and Publish Kintsugi-DAM

on:
  push:
    branches:
      - "main" # Builds 'latest' stable image automatically
      - "feature/**" # Safely builds 'beta-feature-*' images from your tracking branches
      - "dev" # Safely builds a 'beta-dev' image
  workflow_dispatch: # Allows you to manually trigger a build on any branch via the GitHub UI

# 1. DROP ALL DEFAULT PERMISSIONS GLOBALLY
permissions: {}

jobs:
  build-and-push:
    # Explicitly protect the local runner execution matrix
    if: github.repository_owner == 'bheem1224' # Prevents forks from accidentally hijacking or triggering your runner
    runs-on: [self-hosted, linux, x64]
    environment: production

    # 2. GRANT ONLY REQUIRED PERMISSIONS TO THIS JOB
    permissions:
      contents: write # Required to compile assets or tag if needed
      packages: write # Required to push the Docker image to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. DYNAMIC TAG PROCESSING (Replaces manual commit message parsing)
      - name: Determine Docker Tags
        id: extract_tags
        run: |
          BASE_IMAGE="ghcr.io/${{ github.repository_owner }}/kintsugi-dam"

          # Get current branch name cleanly
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          # Normalize the branch name to follow strict lowercase Docker tag compliance
          CLEAN_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | tr '/' '-')

          if [ "$CLEAN_BRANCH" = "main" ]; then
            # Production builds generate both 'latest' and a rolling build timestamp
            TIMESTAMP=$(date +'%Y%m%d%H%M%S')
            TAGS="$BASE_IMAGE:latest,$BASE_IMAGE:stable-$TIMESTAMP"
            echo "Building stable release tag."
          else
            # Feature branches create completely isolated beta tags
            TAGS="$BASE_IMAGE:beta-$CLEAN_BRANCH"
            echo "Building beta feature branch tag: beta-$CLEAN_BRANCH"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      # 4. BUILD THE SINGLE UNIFIED CONTAINER
      - name: Build and push Monolith Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.extract_tags.outputs.tags }}
          # Enables built-in build cache optimization to save local SSD wear on your Unraid runner
          cache-from: type=gha
          cache-to: type=gha,mode=max
